name: 6-Hour Windows RDP with LDPlayer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        net user runneradmin Rdp@TikTok2026!

    - name: Install LDPlayer 9 in Background
      run: |
        Write-Host "Downloading LDPlayer 9..."
        Invoke-WebRequest -Uri "https://encdn.ldmnq.com/download/en/LDPlayer9.exe" -OutFile "$env:TEMP\LDPlayer9.exe"
        Write-Host "Starting silent installation in background..."
        Start-Process -FilePath "$env:TEMP\LDPlayer9.exe" -ArgumentList "/s"

    - name: Start Pinggy Tunnel (No Credit Card Required)
      shell: bash
      run: |
        echo "=========================================="
        echo "USERNAME: runneradmin"
        echo "PASSWORD: Rdp@TikTok2026!"
        echo "=========================================="
        ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:3389 tcp@free.pinggy.io