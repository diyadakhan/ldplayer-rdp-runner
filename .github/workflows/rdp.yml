name: 6-Hour Windows RDP with LDPlayer & TikTok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        net user runneradmin Rdp@TikTok2026!

    - name: Start Pinggy Tunnel & Send IP
      shell: bash
      run: |
        ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R0:localhost:3389 tcp@free.pinggy.io > pinggy.log 2>&1 &
        sleep 10
        cat pinggy.log
        RAW_URL=$(grep -o 'tcp://[a-zA-Z0-9.-]*:[0-9]*' pinggy.log | head -n 1)
        CLEAN_IP=$(echo "$RAW_URL" | sed 's/tcp:\/\///')
        echo "Tunnel address: $CLEAN_IP"
        curl -s -d "$CLEAN_IP" "https://ntfy.sh/diyada_rdp_live"
        echo "Notification sent!"

    - name: Install LDPlayer 9 & Auto-Install TikTok
      run: |
        Write-Host "1. Downloading LDPlayer 9..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri "https://encdn.ldmnq.com/download/en/LDPlayer9.exe" -OutFile "$env:TEMP\LDPlayer9.exe"
        
        Write-Host "2. Starting silent installation with auto-clicker..." -ForegroundColor Cyan
        $proc = Start-Process -FilePath "$env:TEMP\LDPlayer9.exe" -ArgumentList "/S" -PassThru
        
        # Auto-Clicker
        $wshell = New-Object -ComObject WScript.Shell
        for ($i = 0; $i -lt 45; $i++) {
            if ($wshell.AppActivate("LDPlayer")) {
                Start-Sleep -Milliseconds 500
                $wshell.SendKeys("{ENTER}")
                Write-Host "Auto-clicked 'Install' button!"
                break
            }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 1
        }
        $proc.WaitForExit()

        # Wait for folder to exist
        $LDPath = "C:\LDPlayer\LDPlayer9"
        $timeout = 90
        while (!(Test-Path "$LDPath\ldconsole.exe") -and $timeout -gt 0) {
            Start-Sleep -Seconds 2
            $timeout -= 2
        }
        Write-Host "LDPlayer 9 installed successfully at $LDPath!" -ForegroundColor Green

        # Download TikTok APK
        Write-Host "3. Downloading TikTok APK..." -ForegroundColor Cyan
        $ApkUrl = "https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?version=latest"
        Invoke-WebRequest -Uri $ApkUrl -OutFile "$env:TEMP\tiktok.apk" -UserAgent "Mozilla/5.0"

        # Install TikTok into LDPlayer
        Write-Host "4. Installing TikTok into LDPlayer..." -ForegroundColor Cyan
        & "$LDPath\ldconsole.exe" installapp --index 0 --filename "$env:TEMP\tiktok.apk"
        Write-Host "TikTok installed successfully into LDPlayer!" -ForegroundColor Green

        # Launch LDPlayer with TikTok
        Write-Host "5. Launching LDPlayer..." -ForegroundColor Green
        & "$LDPath\dnplayer.exe" index=0
        Write-Host "All systems ready!"

    - name: Keep Tunnel Alive
      shell: bash
      run: |
        wait